name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IS_GITHUB_PAGES: 'true'
      REPO_NAME: 'acce-website'   # <-- must match your repo exactly
      # Canonical public origin. Without this, metadataBase falls back to
      # http://localhost:3000 and every og:image/og:url ships pointing at
      # localhost, so shared links render with no preview image.
      NEXT_PUBLIC_SITE_URL: 'https://www.accecan.ca'
      # Mailchimp audience config for static JSONP signup
      # Define these as Repository Variables (Settings → Variables → Repository variables)
      # They are public values from your Mailchimp embed form, not API keys.
      NEXT_PUBLIC_MAILCHIMP_U: ${{ vars.NEXT_PUBLIC_MAILCHIMP_U }}
      NEXT_PUBLIC_MAILCHIMP_ID: ${{ vars.NEXT_PUBLIC_MAILCHIMP_ID }}
      NEXT_PUBLIC_MAILCHIMP_DC: ${{ vars.NEXT_PUBLIC_MAILCHIMP_DC }}
    steps:
      - name: Check out your repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci

      - name: Build your site (static export to out/)
        run: npm run build

      - name: Add .nojekyll (needed for _next/)
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

      # The site artifact is large (~260 MB of PDFs/images), so Pages can sit
      # in deployment_queued past deploy-pages' timeout when GitHub's queue is
      # congested. The action caps its timeout at 10 minutes (larger values are
      # clamped), so instead of failing the run on the first timeout, retry the
      # deployment once.
      #
      # The first attempt can also fail instantly: deploy-pages looks the
      # artifact up through the artifacts list API, which can lag a moment
      # behind the upload and report "Found 0 artifact(s)" for an artifact
      # that was finalized milliseconds earlier. Retrying straight away hits
      # the same stale listing, so pause before the retry.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy (artifact not listed yet, or Pages queue timed out)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
